<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng tuần hoàn thông minh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Sora:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg0:#04020c;--bg1:#0d0829;--panel:rgba(14,10,42,.66);--line:rgba(160,140,255,.24);--txt:#ebe8ff;--mut:#9d96cc;--cy:#7cf0ff;--am:#ffb86b}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.55 'Be Vietnam Pro',system-ui,sans-serif;color:var(--txt);min-height:100vh;
 background:radial-gradient(1200px 700px at 85% -10%,#2a1066 0,transparent 60%),radial-gradient(900px 600px at 0% 100%,#0b2a5c 0,transparent 55%),linear-gradient(#070418,#04020c)}
#stars{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
h1,h2,h3{font-family:Sora,sans-serif;margin:0}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:18px clamp(14px,3vw,36px) 6px}
header h1{font-size:clamp(20px,2.6vw,28px);letter-spacing:.2px}
header p{margin:2px 0 0;color:var(--mut);font-size:13px}
#search{width:min(300px,100%);padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(10,7,32,.7);color:var(--txt);font:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
main{padding:10px clamp(14px,3vw,36px) 40px;display:grid;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);padding:16px}
.scroll{overflow-x:auto}
#legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:12px}
#legend button{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--txt);font:inherit;font-size:12.5px;cursor:pointer}
#legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
#legend button.on{background:rgba(255,255,255,.12);border-color:var(--c)}
#table{display:grid;grid-template-columns:repeat(18,minmax(46px,1fr));grid-template-rows:repeat(7,auto) 14px repeat(2,auto);gap:4px;min-width:880px}
.cell{--c:#fff;position:relative;padding:3px 4px 4px;border-radius:7px;cursor:pointer;text-align:center;line-height:1.1;
 background:color-mix(in srgb,var(--c) 15%,rgba(8,5,28,.7));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
 transition:transform .12s,box-shadow .12s,opacity .2s;min-height:56px;color:var(--txt);font:inherit}
.cell:hover{transform:scale(1.18);z-index:3;box-shadow:0 0 18px color-mix(in srgb,var(--c) 70%,transparent)}
.cell.sel{box-shadow:0 0 0 2px #fff,0 0 22px var(--c);z-index:2}
.cell.dim{opacity:.16}
.cell .n{display:block;font-size:9.5px;color:var(--mut);text-align:left}
.cell .s{display:block;font:700 16px Sora,sans-serif;color:var(--c)}
.cell .m{display:block;font-size:8.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--mut);border:1px dashed var(--line);border-radius:7px;cursor:default}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
#tabs button{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mut);font:500 14px 'Be Vietnam Pro';cursor:pointer}
#tabs button.on{background:linear-gradient(135deg,#3a22a8,#1a5fb4);color:#fff;border-color:transparent}
.tab{display:none}.tab.on{display:block}
.two{display:grid;grid-template-columns:minmax(280px,5fr) minmax(300px,6fr);gap:18px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.big{width:96px;height:96px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.big b{font:700 38px Sora;color:var(--c);line-height:1}.big span{font-size:12px;color:var(--mut)}
.hero h2{font-size:26px}.hero small{color:var(--c);font-size:13.5px}
.props{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.props div{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.props span{display:block;font-size:11.5px;color:var(--mut)}.props b{font-weight:600;font-size:14px}
.props .wide{grid-column:1/-1}
.note{margin:8px 0 0;color:#d9d4ff}
.viewer{position:relative;min-height:380px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,rgba(60,40,150,.35),rgba(2,1,10,.8))}
.viewer canvas{width:100%;height:100%;display:block;position:absolute;inset:0;touch-action:none;cursor:grab}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;color:var(--mut);font-size:13px}
.btn{padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);font:inherit;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.14)}
input[type=range]{accent-color:var(--cy)}
.hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--mut);pointer-events:none}
.rx{display:grid;grid-template-columns:minmax(240px,3fr) minmax(300px,6fr);gap:18px}
@media(max-width:860px){.rx{grid-template-columns:1fr}}
#rlist{display:grid;gap:6px;align-content:start}
#rlist button{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font:inherit;cursor:pointer}
#rlist button.on{border-color:var(--cy);background:rgba(124,240,255,.1)}
#rlist small{display:block;color:var(--mut)}
#eq{font:700 clamp(18px,2.4vw,26px) Sora;margin:10px 0 2px;color:var(--cy)}
.chat{display:flex;flex-direction:column;height:min(520px,70vh)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 4px 10px}
.m{max-width:86%;padding:10px 13px;border-radius:14px;border:1px solid var(--line);word-wrap:break-word}
.m.bot{align-self:flex-start;background:rgba(80,60,200,.2)}
.m.me{align-self:flex-end;background:rgba(124,240,255,.14)}
.m.ok{border-color:#5ee0a0}.m.bad{border-color:#ff7b8b}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opts button{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);font:inherit;cursor:pointer}
.opts button:hover:not(:disabled){background:rgba(124,240,255,.18)}
.opts button:disabled{opacity:.6;cursor:default}
.opts button.right{border-color:#5ee0a0;background:rgba(94,224,160,.2);opacity:1}
.opts button.wrong{border-color:#ff7b8b;background:rgba(255,123,139,.2);opacity:1}
.row{display:flex;gap:8px;margin-top:8px}
.row input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(8,5,28,.75);color:var(--txt);font:inherit}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;color:var(--mut);font-size:13px}
.bar b{color:var(--am)}
.bar select{background:rgba(8,5,28,.8);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{padding:5px 11px;font-size:12.5px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;font-family:inherit}
.chips button:hover{color:var(--txt);border-color:var(--cy)}
.src{font-size:11px;color:var(--mut);margin-top:4px}
@media(prefers-reduced-motion:reduce){.cell{transition:none}}
</style></head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<header>
  <div><h1>Bảng tuần hoàn thông minh</h1><p>118 nguyên tố, mô hình electron 3D, phản ứng hóa học, ôn tập và trợ lý AI</p></div>
  <input id="search" type="search" placeholder="Tìm theo tên, ký hiệu hoặc số hiệu" aria-label="Tìm nguyên tố">
</header>
<main>
  <section class="panel scroll" aria-label="Bảng tuần hoàn">
    <div id="legend"></div>
    <div id="table"></div>
  </section>

  <section class="panel">
    <div id="tabs" role="tablist">
      <button class="on" data-t="t1">Nguyên tố</button>
      <button data-t="t2">Phản ứng hóa học</button>
      <button data-t="t3">Chatbot ôn tập</button>
      <button data-t="t4">Trợ lý AI</button>
    </div>

    <div id="t1" class="tab on"><div class="two">
      <div id="info"></div>
      <div>
        <div class="viewer"><canvas id="atomCv"></canvas><div class="hint">Kéo chuột để xoay mô hình</div></div>
        <div class="ctrl">
          <button class="btn" id="pauseA">Tạm dừng</button>
          <label>Tốc độ <input type="range" id="spdA" min=".2" max="3" step=".1" value="1"></label>
          <span id="legA">Electron lớp ngoài cùng màu cam</span>
        </div>
      </div>
    </div></div>

    <div id="t2" class="tab"><div class="rx">
      <div id="rlist"></div>
      <div>
        <div class="viewer" style="min-height:340px"><canvas id="rxCv"></canvas><div class="hint">Kéo chuột để xoay</div></div>
        <div id="eq"></div><div id="rinfo" class="note"></div>
        <div class="ctrl"><button class="btn" id="replay">Chạy lại</button>
          <label>Tốc độ <input type="range" id="spdR" min=".3" max="2.5" step=".1" value="1"></label></div>
      </div>
    </div></div>

    <div id="t3" class="tab"><div class="chat">
      <div class="bar">Điểm: <b id="score">0/0</b> Chuỗi đúng: <b id="streak">0</b>
        <label>Phạm vi <select id="lvl"><option value="36">Nguyên tố 1–36</option><option value="54">1–54</option><option value="118">1–118</option></select></label>
        <button class="btn" id="nextQ">Câu mới</button></div>
      <div class="msgs" id="qMsgs"></div>
      <div class="row"><input id="qIn" placeholder="Gõ đáp án hoặc chọn A, B, C, D" aria-label="Đáp án"><button class="btn" id="qSend">Trả lời</button></div>
    </div></div>

    <div id="t4" class="tab"><div class="chat">
      <div class="msgs" id="aMsgs"></div>
      <div class="chips" id="chips"></div>
      <div class="row"><input id="aIn" placeholder="Hỏi về nguyên tố, phản ứng hay khái niệm hóa học" aria-label="Câu hỏi"><button class="btn" id="aSend">Gửi</button></div>
    </div></div>
  </section>
</main>

ì","mendeleev"],"**Bảng tuần hoàn** sắp xếp các nguyên tố theo số hiệu nguyên tử tăng dần, để các nguyên tố cùng cột (nhóm) có tính chất hóa học tương tự do cùng số electron lớp ngoài cùng. Mendeleev công bố bản đầu tiên năm 1869 và còn dự đoán đúng các nguyên tố chưa được tìm ra."]]};

function explainEl(e){const v=e.valence,g=e.group;let t;
 if(e.cat==='noble')t='lớp ngoài cùng đã bão hòa nên rất bền, gần như không phản ứng';
 else if(['transition','lanth','actin'].includes(e.cat))t='electron ở phân lớp d/f cũng tham gia liên kết nên có nhiều hóa trị';
 else if(v<=3)t=`dễ nhường ${v} electron tạo ion dương, thể hiện tính kim loại`;
 else if(v>=5)t=`dễ nhận ${8-v} electron để đạt 8 electron, thể hiện tính phi kim`;
 else t='có xu hướng góp chung 4 electron để tạo liên kết cộng hóa trị';
 const where=`chu kì ${e.period} (có ${e.shells.length} lớp electron)`+(g?`, nhóm ${g}`:', khối f (hai hàng dưới cùng)');
 return `**${e.name} (${e.sym})** có số hiệu ${e.z}, khối lượng nguyên tử khoảng ${e.mass}, thuộc nhóm ${DATA.cats[e.cat].vi.toLowerCase()}.\n• Cấu hình electron: ${e.config}; phân bố theo lớp: ${e.shells.join(', ')}.\n• Vị trí: ${where}.\n• Có ${v} electron lớp ngoài cùng nên ${t}.\n• ${e.note}`}
function localAnswer(q,sel){const ql=q.toLowerCase(),E=DATA.elements;
 for(const r of DATA.reactions)if(r.keys.some(k=>ql.includes(k)))return `**${r.title}**: ${r.eq}\n${r.why}`;

 E.forEach(e=>{if(e.sym.length===2&&new RegExp('\\b'+e.sym+'\\b').test(q)&&!f.includes(e))f.push(e)});
 const con=()=>{for(const[k,t]of DATA.concepts)if(k.some(x=>ql.includes(x)))return t};
 if(!f.length){const c=con();if(c)return c;const s=E.find(x=>x.sym===sel);if(s)f=[s]}
 if(f.length){const e=f[0];
  if(ql.includes('so sánh')&&f.length>1){const a=f[0],b=f[1],L=x=>`• ${x.name}: ${x.config} (lớp ngoài cùng ${x.valence} e, ${DATA.cats[x.cat].vi.toLowerCase()}).`;
   return `**So sánh ${a.name} và ${b.name}**\n${L(a)}\n${L(b)}\n`+(a.group&&a.group===b.group?'Hai nguyên tố cùng nhóm nên có tính chất hóa học tương tự.':'Khác nhóm nên số electron hóa trị khác nhau, dẫn tới tính chất khác nhau.')}
  return explainEl(e)}

  <div class="chips"><button id="askAI">Nhờ trợ lý AI giải thích ${e.name}</button></div>`;

/* ---------- three.js dùng chung ---------- */
function makeScene(cv,z){
 const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}),s=new THREE.Scene(),
  cam=new THREE.PerspectiveCamera(50,1,.1,300),root=new THREE.Group();
 cam.position.z=z;s.add(root,new THREE.AmbientLight(0xffffff,.7));
 const L=new THREE.PointLight(0xffffff,1.3);L.position.set(12,16,24);s.add(L);
 const S={r,s,cam,root,w:0,h:0,vy:.002,vx:0};
 let drag=false,px,py;
 cv.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId)};
 cv.onpointerup=()=>drag=false;
 cv.onpointermove=e=>{if(!drag)return;root.rotation.y+=(e.clientX-px)*.008;root.rotation.x+=(e.clientY-py)*.008;px=e.clientX;py=e.clientY};
 return S;
}
function draw(S,cv){
 if(!cv.offsetParent)return;
 const w=cv.clientWidth,h=cv.clientHeight;
 if(w!==S.w||h!==S.h){S.w=w;S.h=h;S.r.setPixelRatio(Math.min(devicePixelRatio,2));S.r.setSize(w,h,false);S.cam.aspect=w/h;S.cam.updateProjectionMatrix()}
 S.r.render(S.s,S.cam);
}
function clear(g){while(g.children.length){const o=g.children.pop();o.geometry&&o.geometry.dispose()}}
const sph=(r,c,e=0)=>new THREE.Mesh(new THREE.SphereGeometry(r,20,16),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e,roughness:.4}));

/* ---------- mô hình nguyên tử ---------- */
let A,orbits=[];
function buildAtom(e){
 if(!window.THREE)return;
 A=A||makeScene($('#atomCv'),36);
 clear(A.root);orbits=[];A.root.rotation.set(.35,0,0);
 const n=Math.min(e.z,36),m=Math.min(e.neutrons,36),rad=1.1+Math.cbrt(n+m)*.35;
 for(let i=0;i<n+m;i++){const p=sph(.5,i<n?0xff5468:0x8a96b8,.15);
  const v=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(rad*Math.cbrt(Math.random()));
  p.position.copy(v);A.root.add(p)}
 const step=Math.min(2.6,15/e.shells.length);
 e.shells.forEach((cnt,i)=>{
  const R=rad+2.6+i*step,g=new THREE.Group();g.rotation.set(i*.55,i*.9,i*.3);
  g.add(new THREE.Mesh(new THREE.TorusGeometry(R,.05,8,128),new THREE.MeshBasicMaterial({color:0x6a7bff,transparent:true,opacity:.45})));
  const els=[];
  for(let k=0;k<cnt;k++){const outer=i===e.shells.length-1,m=sph(.42,outer?0xffb86b:0x7cf0ff,.9);g.add(m);els.push({m,a:k/cnt*6.283})}
  orbits.push({R,els,sp:1.5/Math.pow(i+1,.75)});A.root.add(g)});
}
$('#pauseA').onclick=e=>{paused=!paused;e.target.textContent=paused?'Tiếp tục':'Tạm dừng'};

/* ---------- phản ứng ---------- */
const COL={H:0xf0f0ff,O:0xff4d5e,N:0x4d7cff,Cl:0x3ddc84,C:0x8a8aa0,Na:0xb36bff,Mg:0xb8e34d,Zn:0x8fa3b8},RAD={H:.42,O:.68,N:.64,Cl:.9,C:.7,Na:1,Mg:.95,Zn:.9};
let R,rx,cur=0;
const fmt=s=>s.replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>');
function buildReactions(){
 const L=$('#rlist');
 D.reactions.forEach((r,i)=>{const b=document.createElement('button');b.innerHTML=`${r.title}<small>${fmt(r.eq)}</small>`;b.onclick=()=>selectReaction(i);L.appendChild(b)});
 $('#replay').onclick=()=>clock=0;
}
function molecule(name){
 const g=new THREE.Group(),at=D.molecules[name];
 at.forEach(([el,x,y,z])=>{const s=sph(RAD[el]||.7,COL[el]||0xffffff,.12);s.position.set(x,y,z);g.add(s)});
 for(let i=0;i<at.length;i++)for(let j=i+1;j<at.length;j++){
  const a=new THREE.Vector3(...at[i].slice(1)),b=new THREE.Vector3(...at[j].slice(1)),d=a.distanceTo(b);
  if(d>1.9)continue;
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,d,8),new THREE.MeshStandardMaterial({color:0xaab0d8}));
  c.position.copy(a).add(b).multiplyScalar(.5);c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());g.add(c)}
 return g;
}
function selectReaction(i){
 cur=i;$$('#rlist button').forEach((b,k)=>b.classList.toggle('on',k===i));
 const r=D.reactions[i];
 $('#eq').innerHTML=fmt(r.eq);
 $('#rinfo').innerHTML=`<b>Loại:</b> ${r.type}. <b>Điều kiện:</b> ${r.cond}.<br>${r.why}`;
 if(!window.THREE)return;
 R=R||makeScene($('#rxCv'),24);
 clear(R.root);R.root.rotation.set(.3,0,0);
 const mk=l=>l.flatMap(([n,c])=>Array.from({length:c},()=>molecule(n)));
 rx={re:mk(r.R),pr:mk(r.P)};
 [...rx.re,...rx.pr].forEach(g=>R.root.add(g));
 const f=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),new THREE.MeshBasicMaterial({color:0xfff3b0,transparent:true,opacity:0}));
 rx.flash=f;R.root.add(f);clock=0;
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function stepReaction(){
 if(!rx)return;
 const T=7,t=((clock*$('#spdR').value)%T)/T,N=rx.re.length,M=rx.pr.length;
 rx.re.forEach((g,i)=>{const a=i/N*6.283,p=ease(Math.min(t/.45,1));
  g.visible=t<.5;const r=10*(1-p)+1.3*p,an=a+p*1.8;
  g.position.set(Math.cos(an)*r,Math.sin(a*2+1)*2.5*(1-p),Math.sin(an)*r);g.rotation.y+=.02;g.rotation.x+=.01});
 rx.pr.forEach((g,i)=>{const a=i/M*6.283+.7,q=ease(Math.max(0,Math.min((t-.5)/.5,1)));
  g.visible=t>=.5;g.position.set(Math.cos(a)*(1+7*q),Math.sin(a*2)*2*q,Math.sin(a)*(1+7*q));g.rotation.y+=.025;g.rotation.z+=.01});
 const fl=Math.max(0,1-Math.abs(t-.5)/.07);rx.flash.material.opacity=fl*.8;rx.flash.scale.setScalar(1+fl*5);
}

/* ---------- vòng lặp ---------- */
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.05);last=now;clock+=dt;
 if(A&&$('#atomCv').offsetParent){
  const sp=+$('#spdA').value;
  if(!paused)orbits.forEach(o=>o.els.forEach(e=>{e.a+=dt*o.sp*sp;e.m.position.set(Math.cos(e.a)*o.R,Math.sin(e.a)*o.R,0)}));
  draw(A,$('#atomCv'));
 }
 if(R&&$('#rxCv').offsetParent){stepReaction();draw(R,$('#rxCv'))}
}

/* ---------- khung chat ---------- */
function say(box,html,cls='bot'){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;box.appendChild(d);box.scrollTop=box.scrollHeight;return d}
const md=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');

/* ---------- chatbot ôn tập ---------- */
let sc=0,tot=0,st=0,Q=null;
const pick=a=>a[Math.random()*a.length|0];
function others(pool,ans,k=3){const s=new Set([ans]);let g=0;while(s.size<k+1&&g++<200)s.add(pick(pool));return [...s]}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
function makeQ(){
 const lim=+$('#lvl').value,P=D.elements.filter(e=>e.z<=lim),e=pick(P),main=P.filter(x=>x.cat!=='transition'&&x.cat!=='noble'&&x.cat!=='lanth'&&x.cat!=='actin');
 const t=Math.random()*5|0;
 if(t===0)return{p:`Ký hiệu hóa học của **${e.name}** là gì?`,a:e.sym,o:others(P.map(x=>x.sym),e.sym),x:`${e.name} có ký hiệu ${e.sym}.`};
 if(t===1)return{p:`Nguyên tố có số hiệu nguyên tử **${e.z}** là gì?`,a:e.name,o:others(P.map(x=>x.name),e.name),x:`Số hiệu ${e.z} là ${e.name} (${e.sym}), có ${e.z} proton.`};
 if(t===2){const a=D.cats[e.cat].vi;return{p:`**${e.name}** (${e.sym}) thuộc loại nguyên tố nào?`,a,o:others(Object.values(D.cats).map(c=>c.vi),a),x:`${e.name} thuộc nhóm ${a.toLowerCase()}.`}}
 if(t===3)return{p:`**${e.name}** nằm ở chu kì mấy?`,a:String(e.period),o:others(['1','2','3','4','5','6','7'],String(e.period)),x:`${e.name} có ${e.shells.length} lớp electron (${e.shells.join(', ')}) nên ở chu kì ${e.period}.`};
 const m=pick(main.filter(x=>x.z>2));
 return{p:`Nguyên tử **${m.name}** có bao nhiêu electron ở lớp ngoài cùng?`,a:String(m.valence),o:others(['1','2','3','4','5','6','7','8'],String(m.valence)),x:`Cấu hình ${m.config} nên lớp ngoài cùng có ${m.valence} electron.`};
}
function initQuiz(){
 const box=$('#qMsgs');
 say(box,'Chào bạn, mình sẽ ra câu hỏi trắc nghiệm về bảng tuần hoàn. Chọn đáp án hoặc gõ câu trả lời nhé.');
 $('#nextQ').onclick=nextQ;$('#lvl').onchange=nextQ;
 $('#qSend').onclick=()=>{const v=$('#qIn').value.trim();if(v){$('#qIn').value='';answer(v)}};
 $('#qIn').onkeydown=e=>{if(e.key==='Enter')$('#qSend').click()};
 nextQ();
}
function nextQ(){
 Q=makeQ();Q.o=shuffle(Q.o);Q.done=false;
 const d=say($('#qMsgs'),md(Q.p)+'<div class="opts"></div>');Q.el=d;
 Q.o.forEach((o,i)=>{const b=document.createElement('button');b.textContent='ABCD'[i]+'. '+o;b.onclick=()=>answer(o,true);d.querySelector('.opts').appendChild(b)});
}
const nz=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().trim();
function answer(v,fromBtn){
 if(!Q||Q.done)return;
 if(!fromBtn){say($('#qMsgs'),md(v),'me');const i='abcd'.indexOf(nz(v));if(v.length===1&&i>=0&&i<Q.o.length)v=Q.o[i]}
 else say($('#qMsgs'),md(v),'me');
 Q.done=true;tot++;const ok=nz(v)===nz(Q.a);
 if(ok){sc++;st++}else st=0;
 Q.el.querySelectorAll('button').forEach((b,i)=>{b.disabled=true;if(Q.o[i]===Q.a)b.classList.add('right');else if(Q.o[i]===v)b.classList.add('wrong')});
 $('#score').textContent=`${sc}/${tot}`;$('#streak').textContent=st;
 say($('#qMsgs'),(ok?'**Chính xác!** ':`**Chưa đúng.** Đáp án là **${Q.a}**. `).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+Q.x,ok?'bot ok':'bot bad');
 setTimeout(nextQ,900);
}

/* ---------- trợ lý AI ---------- */
const hist=[];
function initAI(){
 say($('#aMsgs'),'Mình là trợ lý hóa học. Hãy chọn một nguyên tố trên bảng rồi hỏi, hoặc thử các gợi ý bên dưới.');
 ['Giải thích cấu hình electron của sắt','Vì sao natri phản ứng mạnh với nước?','So sánh natri và kali','Liên kết ion là gì?','Quy luật theo chu kì và nhóm'].forEach(t=>{
  const b=document.createElement('button');b.textContent=t;b.onclick=()=>ask(t);$('#chips').appendChild(b)});
 $('#aSend').onclick=()=>{const v=$('#aIn').value.trim();if(v){$('#aIn').value='';ask(v)}};
 $('#aIn').onkeydown=e=>{if(e.key==='Enter')$('#aSend').click()};
}
async function ask(text){
 const box=$('#aMsgs');say(box,md(text),'me');hist.push({role:'user',content:text});
 const w=say(box,'Đang suy nghĩ...');
 try{
  const r={answer:localAnswer(text,sel&&sel.sym),source:'Cục bộ'};
  w.innerHTML=md(r.answer)+`<div class="src">Nguồn: ${r.source}</div>`;hist.push({role:'assistant',content:r.answer});
 }catch(e){w.textContent='Không kết nối được máy chủ.'}
 box.scrollTop=box.scrollHeight;
}
</script></body></html>
